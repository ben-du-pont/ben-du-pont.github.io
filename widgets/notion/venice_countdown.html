<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IRONMAN 70.3 Venice-Jesolo 2027 countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<!--
  Notion countdown widget for IRONMAN 70.3 Venice-Jesolo 2027.
  Embed: https://ben-du-pont.github.io/widgets/notion/venice_countdown.html
  Options (query string):
    ?theme=light | dark      force a theme (default: follows the system / Notion app setting)
    ?bg=transparent          no card background (blends into the Notion page)
  Layout adapts to the embed size: tiny (days only), compact, full (blocks, distances, progress).
  Colours: IRONMAN.com race palette (official logo yellow #F2D15A + sage #88A898, extra: Adriatic blue-green #12303A).
-->
<style>
  :root {
    --c1:#F2D15A; --c1b:#F7E08C; --c3:#5E8473; --on-c1:#14303A; --im:#14303A; --tag:#B8921A; --race:#5E8473; --numc:#5E8473; --ink:#14303A; --muted:#5D6F6C; --card:#F8F5E6; --glow:rgba(242,209,90,.35); --glow2:rgba(136,168,152,.22); --tile:rgba(136,168,152,.16); --tile-line:rgba(94,132,115,.25); --tile-ink:#14303A; --c2:#F2D15A;
    --radius: 14px;
  }
  :root[data-theme="dark"] {
    --c1:#F4D25A; --c1b:#F9E38F; --c3:#8AAA9A; --on-c1:#14303A; --im:#F7F4E8; --tag:#F4D25A; --race:#A3C2B2; --numc:#F4D25A; --ink:#F7F4E8; --muted:#A6BBB3; --card:#12303A; --glow:rgba(244,210,90,.22); --glow2:rgba(138,170,154,.20); --tile:rgba(138,170,154,.14); --tile-line:rgba(138,170,154,.28); --tile-ink:#EEF4EF; --c2:#F4D25A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    container-type: size;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    display: grid; place-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; height: 100%;
    padding: clamp(8px, 4cqmin, 28px);
    background:
      radial-gradient(120% 160% at 100% 0%, var(--glow) 0%, transparent 55%),
      radial-gradient(90% 120% at 0% 100%, var(--glow2) 0%, transparent 60%),
      var(--card);
    border-radius: var(--radius);
    display: flex; flex-direction: column; justify-content: center; gap: clamp(4px, 2.5cqh, 16px);
    position: relative; overflow: hidden;
  }
  body.bare .card { background: transparent; }
  .card::before {            /* race-colour band */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
    background: linear-gradient(90deg, var(--c1), var(--c2) 55%, var(--c3));
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; letter-spacing: .06em;
           font-size: clamp(14px, min(5cqi, 11cqh), 44px); line-height: 1; text-transform: uppercase; }
  .brand { display: flex; align-items: center; gap: .35em; }
  .brand .logo { height: 1.45em; width: auto; flex: none; }
  .mark { position: absolute; right: -6%; bottom: -34%; height: 80cqh; width: auto; opacity: .08; pointer-events: none; }
  .card > *:not(.mark) { position: relative; }
  .brand .im { color: var(--im); }
  .brand .tag { color: var(--tag); }
  .brand .race { color: var(--race); }
  .meta { font-size: clamp(10px, min(2.4cqi, 6cqh), 18px); color: var(--muted); white-space: nowrap; }
  .blocks { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(4px, 1.6cqi, 14px); }
  .block { border-radius: calc(var(--radius) - 4px); padding: clamp(6px, 2cqmin, 16px) 4px;
           text-align: center; background: var(--tile); color: var(--tile-ink);
           box-shadow: inset 0 0 0 1px var(--tile-line); }
  .block:first-child { background: linear-gradient(160deg, var(--c1), var(--c1b)); color: var(--on-c1); box-shadow: 0 6px 18px -8px var(--c1); }
  .num { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; line-height: .95;
         font-size: clamp(22px, min(11cqi, 26cqh), 120px); font-variant-numeric: tabular-nums; display: block; }
  .lbl { font-size: clamp(9px, min(1.9cqi, 4.5cqh), 16px); text-transform: uppercase; letter-spacing: .12em; opacity: .8; }
  .num.tick { animation: tick .35s ease-out; }
  @keyframes tick { from { transform: translateY(-14%); opacity: .35; } to { transform: none; opacity: 1; } }
  .foot { display: flex; align-items: center; gap: 12px; font-size: clamp(9px, min(2.1cqi, 5cqh), 16px); color: var(--muted); }
  .legs { display: flex; gap: 10px; white-space: nowrap; }
  .legs b { color: var(--ink); font-weight: 600; }
  .bar { flex: 1; height: clamp(4px, 2.5cqh, 10px); border-radius: 99px; background: var(--tile-line); overflow: hidden; min-width: 60px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit;
           background: linear-gradient(90deg, var(--c1), var(--c3)); transition: width 1s ease; }
  .big { display: none; }
  .done { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(20px, 10cqmin, 64px); color: var(--numc); }

  /* Compact: hide distances, keep progress */
  @container (max-width: 520px) { .legs { display: none; } }
  /* Small: days only + h:m:s line */
  @container (max-width: 380px) or (max-height: 170px) {
    .blocks, .foot { display: none; }
    .big { display: flex; align-items: baseline; gap: 10px; }
    .big .num { color: var(--numc); font-size: clamp(30px, min(20cqi, 55cqh), 140px); }
    .big .hms { font-size: clamp(11px, min(4cqi, 12cqh), 24px); color: var(--muted); font-variant-numeric: tabular-nums; }
    .meta { display: none; }
  }
  @container (max-width: 380px) or (max-height: 170px) { .mark { height: 90cqh; bottom: -20%; } }
  @container (max-height: 90px) { .card::before { height: 3px; } .head { display: none; } }
  @media (prefers-reduced-motion: reduce) { .num.tick { animation: none; } .bar i { transition: none; } }
</style>
</head>
<body>
<div class="card" role="timer" aria-live="off">
  <img class="mark" src="img/venice_mark.png" alt="">
  <div class="head">
    <div class="brand"><img class="logo" src="img/venice_mark.png" alt=""><span class="im">IRONMAN</span> <span class="tag">70.3</span> <span class="race">Venice-Jesolo</span></div>
    <div class="meta">Sat 24 Apr 2027 · Jesolo</div>
  </div>
  <div class="blocks" id="blocks">
    <div class="block"><span class="num" id="d">–</span><span class="lbl">Days</span></div>
    <div class="block"><span class="num" id="h">–</span><span class="lbl">Hours</span></div>
    <div class="block"><span class="num" id="m">–</span><span class="lbl">Min</span></div>
    <div class="block"><span class="num" id="s">–</span><span class="lbl">Sec</span></div>
  </div>
  <div class="big"><span class="num" id="bd">–</span><span class="hms"><span id="bdl">days</span> · <span id="hms">–</span></span></div>
  <div class="foot">
    <div class="legs"><span>Swim <b>1.9</b></span><span>Bike <b>90</b></span><span>Run <b>21.1</b></span></div>
    <span>Season</span><div class="bar" title="Season progress since 12 Oct 2026"><i id="bar"></i></div>
    <span id="pct"></span>
  </div>
</div>
<script>
  const RACE  = new Date('2027-04-24T08:00:00+02:00');   // gun time, local race time zone
  const SEASON_START = new Date('2026-10-12T00:00:00+02:00');
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const applyTheme = () => root.dataset.theme = q.get('theme') || (mq.matches ? 'dark' : 'light');
  applyTheme(); mq.addEventListener?.('change', applyTheme);
  if (q.get('bg') === 'transparent') document.body.classList.add('bare');

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const set = (id, v) => { const el = $(id); if (el.textContent !== String(v)) {
    el.textContent = v; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); } };

  function render() {
    const now = Date.now(), diff = RACE - now;
    if (diff <= 0) {
      const ago = Math.floor(-diff / 864e5);
      const msg = ago < 1 ? 'RACE DAY' : `Raced ${ago} day${ago === 1 ? '' : 's'} ago`;
      $('blocks').outerHTML = `<div class="done">${msg}</div>`;
      document.querySelector('.big').innerHTML = `<span class="done">${msg}</span>`;
      $('bar').style.width = '100%'; $('pct').textContent = '100%';
      clearInterval(timer); return;
    }
    const d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24,
          m = Math.floor(diff / 6e4) % 60,  s = Math.floor(diff / 1e3) % 60;
    set('d', d); set('h', pad(h)); set('m', pad(m)); set('s', pad(s));
    $('bd').textContent = d; $('bdl').textContent = d === 1 ? 'day' : 'days';
    $('hms').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    const p = Math.min(1, Math.max(0, (now - SEASON_START) / (RACE - SEASON_START)));
    $('bar').style.width = (p * 100).toFixed(1) + '%'; $('pct').textContent = Math.round(p * 100) + '%';
  }
  const timer = setInterval(render, 1000); render();
</script>
</body>
</html>
